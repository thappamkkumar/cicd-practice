name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.quality-result.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  

      - name: Check PHP
        run: php -v

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run code style check
        run: ./vendor/bin/pint --test

      - name: Check GitHub token
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN is available"
          else
            echo "GITHUB_TOKEN is missing"
            exit 1
          fi


  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cicd_lab
          MYSQL_USER: cicd
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Check PHP
        run: php -v
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      
      - name: Create environment file
        run: cp .env.example .env

      - name: Set application environment
        run: echo "APP_ENV=${{ vars.APP_ENV }}" >> .env

      - name: Configure MySQL
        run: |
          sed -i 's/^DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=cicd_lab" >> .env
          echo "DB_USERNAME=cicd" >> .env
          echo "DB_PASSWORD=secret" >> .env

      - name: Generate application key
        run: php artisan key:generate
      
      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test


  build:
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
       
      - name: Check quality result
        run: echo "Quality result:- ${{ needs.quality.outputs.status }}"
      
      - name: Create build output
        run: |
          mkdir build
          echo "Laravel CI build completed" > build/status.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-build
          path: build/
        
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-build
          path: build/

      - name: Inspect artifact
        run: cat build/status.txt